name: SkullCount
options:
  bundleIdPrefix: com.victorlamache
  deploymentTarget:
    iOS: "17.0"

targets:
  SkullCount:
    type: application
    platform: iOS
    sources:
      - SkullCount
    info:
      path: SkullCount/Info.plist
      properties:
        CFBundleDisplayName: "SkullCount"
        CFBundleName: "SkullCount"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorlamache.skullcountdev
        DEVELOPMENT_TEAM: A63WD37CXZ
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Victor Lamache Dev Profile"
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: SwiftData.framework
      - sdk: Charts.framework

  SkullCountTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SkullCountTests
    dependencies:
      - target: SkullCount
    info:
      path: SkullCountTests/Info.plist
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.victorlamache.skullcountdev.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.9"
